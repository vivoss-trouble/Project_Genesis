[package]
name = "lazarus-shadow-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
lazarus-contracts = { path = "../lazarus-contracts" }
lazarus-orchestrator = { path = "../lazarus-orchestrator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
