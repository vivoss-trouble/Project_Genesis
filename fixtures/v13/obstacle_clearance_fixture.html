<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesis v13.0 Obstacle Fixture</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #10141c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 900px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(0deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 64px 64px,
        #10141c;
      color: #f5f7fb;
    }

    main {
      width: min(920px, calc(100vw - 48px));
      margin: 58px auto;
      padding: 28px;
      background: #171d28;
      border: 1px solid #3a4558;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .target-zone {
      position: relative;
      height: 360px;
      border: 1px dashed #6b7890;
      display: grid;
      place-items: center;
      background: #121824;
    }

    .next-chapter {
      min-width: 220px;
      min-height: 74px;
      border: 0;
      border-radius: 0;
      background: #22c55e;
      color: #08130c;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(5, 9, 18, 0.58);
      display: grid;
      place-items: center;
    }

    .modal {
      width: 520px;
      padding: 24px;
      background: #f8fafc;
      color: #111827;
      border: 4px solid #ff2d55;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .modal p {
      margin: 0 0 20px;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .actions button {
      min-height: 48px;
      border: 0;
      border-radius: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .valid {
      background: #22c55e;
      color: #061208;
    }

    .trap {
      background: #f97316;
      color: #160a04;
    }

    body.cleared .modal-scrim {
      display: none;
    }
  </style>
</head>
<body>
  <main aria-label="Genesis v13 obstacle test field">
    <h1>Genesis v13.0 Obstacle Fixture</h1>
    <section class="target-zone" aria-label="blocked target zone">
      <button id="next-chapter" class="next-chapter" aria-label="Next chapter">Next chapter</button>
    </section>
  </main>

  <section id="modal-scrim" class="modal-scrim" role="presentation" aria-label="Genesis obstacle scrim">
    <section id="obstacle-modal" class="modal" role="dialog" aria-modal="true" aria-label="Genesis obstacle modal">
      <h2>Genesis obstacle modal</h2>
      <p>The target is intentionally covered. Only the whitelisted close control may be selected.</p>
      <div class="actions" aria-label="modal controls">
        <button id="close-button" class="valid" aria-label="Close">Close</button>
        <button class="trap" aria-label="Accept all">Accept all</button>
        <button class="trap" aria-label="Subscribe">Subscribe</button>
        <button class="trap" aria-label="Continue">Continue</button>
      </div>
    </section>
  </section>

  <script>
    document.getElementById("close-button").addEventListener("click", () => {
      document.body.classList.add("cleared");
      document.body.setAttribute("data-genesis-obstacle", "cleared");
    });

    document.getElementById("next-chapter").addEventListener("click", () => {
      document.body.setAttribute("data-genesis-target", "fired");
    });
  </script>
</body>
</html>
