<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Genesis v15.0 Pagination - Page 1</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #17181c;
    }
    main {
      width: min(820px, calc(100vw - 64px));
      margin: 96px auto;
      padding: 32px;
      background: white;
      border: 1px solid #d7d9df;
      border-radius: 10px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 34px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    .nav-row {
      margin-top: 48px;
      display: flex;
      justify-content: flex-end;
    }
    button {
      min-width: 180px;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: #2457c5;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(15, 20, 32, 0.45);
    }
    .backdrop[hidden] {
      display: none;
    }
    .dialog {
      width: min(520px, calc(100vw - 72px));
      padding: 28px;
      background: white;
      border: 2px solid #2a2d36;
      border-radius: 8px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
    }
    .dialog h2 {
      margin: 0 0 12px;
      font-size: 26px;
    }
    .dialog p {
      margin-bottom: 24px;
      font-size: 16px;
    }
    .dialog-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .trap {
      background: #7f3b08;
    }
    .close {
      background: #126236;
    }
  </style>
</head>
<body>
  <main>
    <h1>Genesis v15.0 Page 1</h1>
    <p>The long-clock controller must freeze the pagination step, clear the modal once, then fresh-remap before continuing.</p>
    <div class="nav-row">
      <button type="button" aria-label="Next chapter" onclick="location.href='page2.html'">Next chapter</button>
    </div>
  </main>

  <div class="backdrop" role="dialog" aria-modal="true" aria-label="Genesis modal dialog">
    <section class="dialog">
      <h2>Genesis modal dialog</h2>
      <p>This obstacle intentionally covers the pagination target for exactly one long-clock step.</p>
      <div class="dialog-actions">
        <button type="button" class="close" aria-label="Close" onclick="document.querySelector('.backdrop').hidden = true">Close</button>
        <button type="button" class="trap" aria-label="Accept all">Accept all</button>
        <button type="button" class="trap" aria-label="Subscribe">Subscribe</button>
        <button type="button" class="trap" aria-label="Continue">Continue</button>
      </div>
    </section>
  </div>
</body>
</html>
