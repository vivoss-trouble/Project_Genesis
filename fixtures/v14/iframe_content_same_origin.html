<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesis v14 Same Origin Iframe Content</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: rgba(5, 9, 18, 0.72);
      color: #111827;
    }

    .modal {
      width: 520px;
      padding: 24px;
      background: #f8fafc;
      border: 4px solid #ff2d55;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .valid {
      background: #22c55e;
      color: #061208;
    }

    .trap {
      background: #f97316;
      color: #160a04;
    }
  </style>
</head>
<body>
  <section class="modal" role="dialog" aria-modal="true" aria-label="Genesis iframe modal">
    <h2>Genesis iframe modal</h2>
    <p>The target is covered from inside a same-origin iframe.</p>
    <div class="actions" aria-label="iframe modal controls">
      <button id="close-button" class="valid" aria-label="Close">Close</button>
      <button class="trap" aria-label="Accept all">Accept all</button>
      <button class="trap" aria-label="Subscribe">Subscribe</button>
      <button class="trap" aria-label="Continue">Continue</button>
    </div>
  </section>

  <script>
    document.getElementById("close-button").addEventListener("click", () => {
      window.parent.postMessage({ type: "genesis-v14-close" }, "*");
    });
  </script>
</body>
</html>
